apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap
  namespace: vault
spec:
  template:
    spec:
      containers:
      - name: vault-bootstrap
        image: hashicorp/vault:1.15.2
        env:
        - name: VAULT_ADDR
          value: http://vault-internal.vault.svc.cluster.local:8200
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: vault-root-token
              key: token
        command:
        - /bin/sh
        - -c
        - |
          echo "Enabling KV-V2 Secrets Engine..."
          vault secrets enable -path=secret kv-v2 || true

          echo "Creating Database Policy..."
          vault policy write database-policy - <<EOF
          path "secret/data/postgres-credentials" {
            capabilities = ["read"]
          }
          EOF
      restartPolicy: OnFailure