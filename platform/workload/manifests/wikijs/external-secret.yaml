apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wikijs-secrets-sync
  namespace: database
spec:
  refreshInterval: 15s
  secretStoreRef:
    kind: SecretStore
    name: vault-backend
  target:
    name: wikijs-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: password
      remoteRef:
        key: wikijs-credentials
        property: db_password