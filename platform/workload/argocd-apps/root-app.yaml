apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/letDouglas/zenith.git
    targetRevision: dev
    path: platform/workload/argocd-apps
  destination:
    server: zenith-workload
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true